<!doctype html>
<html lang="sr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>VulnLab</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<nav>
    <div class="logo">VulnLab</div>
    <div>
        <a href="{{ url_for('index') }}">Početna</a>
        <a href="{{ url_for('users') }}">Korisnici</a>
        <a href="{{ url_for('about') }}">O projektu</a>
        {% if session.get('user') %}
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('logout') }}">Odjava</a>
        {% else %}
        <a href="{{ url_for('login') }}">Prijava</a>
        {% endif %}
    </div>
</nav>
{% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
    <div class="container" style="padding-bottom:0"><div class="alert {{ category }}">{{ message }}</div></div>
    {% endfor %}
{% endwith %}
{% block content %}{% endblock %}
</body>
</html>
